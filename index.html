<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка JavaScript</title>
</head>
<body>
    <h1>Проверка работоспособности</h1>
    <p id="message">Загрузка...</p>

    <script>
        // Изменяем текст в абзаце
        document.getElementById('message').innerHTML = '✅ Сайт работает!';

        // Выводим сообщение в консоль разработчика (F12)
        console.log('Привет, консоль! Всё работает.');
    </script>
</body>
</html>
